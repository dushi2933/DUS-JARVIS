<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="crimsonPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Ring -->
  <rect width="512" height="512" rx="100" fill="#030712" />
  
  <!-- Hologram Grid lines -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#eab308" stroke-width="2" opacity="0.5" stroke-dasharray="14 8" />

  <!-- Iron Man Gauntlet Palm & Arc Repulsor Silhouette -->
  <!-- Forearm Base -->
  <path d="M180 430 L332 430 L350 320 L162 320 Z" fill="url(#crimsonPlate)" stroke="#fef08a" stroke-width="2" />
  
  <!-- Palm Base Plate -->
  <path d="M162 320 L350 320 L370 200 L142 200 Z" fill="url(#crimsonPlate)" stroke="#eab308" stroke-width="3" />

  <!-- Fingers -->
  <!-- Thumb -->
  <path d="M142 240 L90 190 L110 160 L155 200 Z" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5" />
  <!-- Index -->
  <path d="M160 195 L170 80 L205 80 L205 195 Z" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5" />
  <!-- Middle -->
  <path d="M220 195 L225 60 L260 60 L265 195 Z" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5" />
  <!-- Ring -->
  <path d="M280 195 L285 85 L320 85 L320 195 Z" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5" />
  <!-- Pinky -->
  <path d="M335 200 L345 110 L375 115 L365 210 Z" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5" />

  <!-- Arc Reactor Repulsor Core in Palm -->
  <circle cx="256" cy="260" r="48" fill="url(#arcGlow)" />
  <circle cx="256" cy="260" r="32" fill="#ffffff" filter="drop-shadow(0 0 16px #38bdf8)" />
  
  <!-- Arc Core Segment Spokes -->
  <line x1="256" y1="218" x2="256" y2="302" stroke="#0284c7" stroke-width="2" opacity="0.8" />
  <line x1="214" y1="260" x2="298" y2="260" stroke="#0284c7" stroke-width="2" opacity="0.8" />
  <line x1="226" y1="230" x2="286" y2="290" stroke="#0284c7" stroke-width="2" opacity="0.8" />
  <line x1="226" y1="290" x2="286" y2="230" stroke="#0284c7" stroke-width="2" opacity="0.8" />
  
  <circle cx="256" cy="260" r="14" fill="#ffffff" />
</svg>
