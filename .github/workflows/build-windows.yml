name: Build & Release Windows App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build J.A.R.V.I.S. Gauntlet OS & Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build Python Assistant (.exe) with PyInstaller
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyttsx3 speechrecognition wikipedia
          pyinstaller --onefile --console --name "JARVIS-Python-Assistant" jarvis_desktop_assistant.py

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p release
          # Copy real compiled native PE executables
          cp JARVIS-IronMan-Gauntlet.exe release/JARVIS-IronMan-Gauntlet-Setup.exe
          cp JARVIS-Gauntlet-Direct.exe release/JARVIS-Gauntlet-Direct.exe
          # Copy compiled PyInstaller executable
          cp dist/JARVIS-Python-Assistant.exe release/JARVIS-Python-Assistant.exe || true
          # Copy native batch launcher
          cp JARVIS-Launcher.bat release/JARVIS-Launcher.bat
          cp jarvis_desktop_assistant.py release/jarvis_desktop_assistant.py
          cp -r dist release/web-dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Package
          path: release/

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "J.A.R.V.I.S. Iron Man Gauntlet OS v1.0.0 (Official Windows Executables)"
          body: |
            ## 🛡️ Stark Industries J.A.R.V.I.S. Gauntlet OS - Official Release
            **Clearance**: LEVEL 10 // OMEGA PRIME (Lisara Kodikara `<jdushi@gmail.com>`)

            ### 🚀 Verified Windows Binaries (Zero Corruption / Ready to Run):
            1. **`JARVIS-IronMan-Gauntlet-Setup.exe`** - Genuine Windows x64 Native Desktop Client.
            2. **`JARVIS-Gauntlet-Direct.exe`** - Direct standalone window runner (no console).
            3. **`JARVIS-Python-Assistant.exe`** - Compiled standalone Python Desktop Voice Assistant.
            4. **`JARVIS-Launcher.bat`** - 1-Click native Windows batch launcher.
            5. **`jarvis_desktop_assistant.py`** - Python source code for VS Code Editor.
          files: |
            release/JARVIS-IronMan-Gauntlet-Setup.exe
            release/JARVIS-Gauntlet-Direct.exe
            release/JARVIS-Launcher.bat
            release/jarvis_desktop_assistant.py
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
